basePath: /
definitions:
  main.errorResponse:
    properties:
      code:
        example: 400
        type: integer
      data: {}
      message:
        example: keyword is required
        type: string
    type: object
  main.healthData:
    properties:
      status:
        example: ok
        type: string
    type: object
  main.healthResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/main.healthData'
      message:
        example: success
        type: string
    type: object
  main.pagination:
    properties:
      page:
        example: 1
        type: integer
      pageSize:
        example: 20
        type: integer
      total:
        example: "7"
        type: string
    type: object
  main.paginationRequest:
    properties:
      page:
        example: 1
        type: integer
      pageSize:
        example: 20
        type: integer
      total:
        example: 0
        type: integer
    type: object
  main.searchData:
    properties:
      list:
        items:
          $ref: '#/definitions/main.searchHit'
        type: array
      pagination:
        $ref: '#/definitions/main.pagination'
    type: object
  main.searchHighlight:
    properties:
      summary:
        example: '...使用 <mark>快速</mark>开始完成配置...'
        type: string
      title:
        example: <mark>快速</mark>开始
        type: string
    type: object
  main.searchHit:
    properties:
      docId:
        example: test-kirito
        type: string
      highlight:
        $ref: '#/definitions/main.searchHighlight'
      id:
        example: doc_9fd2d776b6a4521d685e27ede29f052003c8353455ec5341b3831089f14e1220
        type: string
      path:
        example: /test-kirito
        type: string
      summary:
        example: '...使用快速开始完成配置...'
        type: string
      title:
        example: 快速开始
        type: string
      url:
        example: https://help.test.starviewcloud.com/test-kirito
        type: string
    type: object
  main.searchListRequest:
    properties:
      keyword:
        example: 快速开始
        type: string
      pagination:
        $ref: '#/definitions/main.paginationRequest'
    type: object
  main.searchResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/main.searchData'
      message:
        example: success
        type: string
    type: object
  main.searchSuggestion:
    properties:
      docId:
        example: test-kirito
        type: string
      keyword:
        example: 域名管理
        type: string
      path:
        example: /test-kirito
        type: string
      title:
        example: 域名防封使用说明
        type: string
      url:
        example: https://help.test.starviewcloud.com/test-kirito
        type: string
    type: object
  main.suggestionData:
    properties:
      list:
        items:
          $ref: '#/definitions/main.searchSuggestion'
        type: array
    type: object
  main.suggestionListRequest:
    properties:
      keyword:
        example: 管理
        type: string
      limit:
        example: 8
        type: integer
    type: object
  main.suggestionResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/main.suggestionData'
      message:
        example: success
        type: string
    type: object
  main.syncData:
    properties:
      status:
        example: synced
        type: string
    type: object
  main.syncRequest:
    properties:
      docId:
        type: string
    type: object
  main.syncResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/main.syncData'
      message:
        example: success
        type: string
    type: object
info:
  contact: {}
  description: 面向公开已发布文档的全文搜索与索引同步服务。
  title: 文档中心搜索服务 API
  version: "1.0"
paths:
  /healthz:
    get:
      description: 用于负载均衡与监控系统检测 Go 服务是否存活。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthResponse'
      summary: 健康检查
      tags:
      - 系统
  /internal/sync:
    post:
      consumes:
      - application/json
      description: 文档存在且公开时写入索引；不存在、下架或菜单不可见时删除索引。仅限 Strapi 内网调用。
      parameters:
      - description: 需要同步的文档标识
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.syncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.syncResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.errorResponse'
      security:
      - BearerAuth: []
      summary: 同步单篇文档索引
      tags:
      - 内部同步
  /search/list:
    post:
      consumes:
      - application/json
      description: 仅按标题搜索已发布且具有已发布菜单路径的文档，与关键词联想保持一致。
      parameters:
      - description: 搜索条件与分页参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.searchListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.searchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: 搜索公开文档
      tags:
      - 搜索
  /search/suggestions/list:
    post:
      consumes:
      - application/json
      description: 仅按文档标题匹配，不记录热门词或用户搜索行为。空关键词返回空列表。
      parameters:
      - description: 输入关键词与返回数量
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.suggestionListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.suggestionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: 获取搜索关键词建议
      tags:
      - 搜索
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 内部同步接口使用 Bearer Token 鉴权。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
